<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e1e2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Live Editor">
<title>Live Editor</title>
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
<style>
  :root { --bg:#fff; --ed:#1e1e2e; --fg:#cdd6f4; --bubble:#7c3aed; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none; }
  #view { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:#fff; }
  #editor-wrap { position:fixed; inset:0; background:var(--ed); display:none; }
  #editor {
    width:100%; height:100%; box-sizing:border-box; border:0; outline:0; resize:none;
    background:var(--ed); color:var(--fg);
    font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding:16px; padding-top:calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));
    white-space:pre; overflow:auto; tab-size:2;
  }
  body.editing #editor-wrap { display:block; }
  body.editing #view { visibility:hidden; }
  #bubble {
    position:fixed; z-index:99999; width:40px; height:40px; left:0; top:0;
    border-radius:50%; background:var(--bubble); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font:700 13px/1 ui-monospace, Menlo, monospace;
    box-shadow:0 2px 10px rgba(0,0,0,.35); cursor:grab; user-select:none;
    -webkit-user-select:none; touch-action:none; opacity:.9;
  }
  #bubble:active { cursor:grabbing; opacity:1; }
</style>
</head>
<body>
<iframe id="view" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe>
<div id="editor-wrap"><textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div>
<div id="bubble" title="Chuyển đổi">&lt;/&gt;</div>

<script>
(function () {
  var KEY = 'love3107', POS_KEY = 'love3107_pos';
  var DEFAULT_CODE = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<style>\n  body { font-family: sans-serif; display:grid; place-items:center; height:100vh; margin:0; background:#fdf2f8; }\n  h1 { color:#db2777; }\n</style>\n</head>\n<body>\n  <h1 id="t">Xin chào ❤️</h1>\n  <script>\n    document.getElementById("t").onclick = function(){ this.textContent = "Bạn vừa bấm!"; };\n  <\/script>\n</body>\n</html>';

  var view = document.getElementById('view');
  var ed = document.getElementById('editor');
  var bubble = document.getElementById('bubble');

  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var saved = load(KEY);
  ed.value = saved !== null ? saved : DEFAULT_CODE;
  render();

  var t;
  function render() { view.srcdoc = ed.value; }
  ed.addEventListener('input', function () {
    save(KEY, ed.value);
    clearTimeout(t);
    t = setTimeout(render, 120);
  });

  // Phím Tab => 2 dấu cách
  ed.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = ed.selectionStart, en = ed.selectionEnd;
      ed.value = ed.value.slice(0, s) + '  ' + ed.value.slice(en);
      ed.selectionStart = ed.selectionEnd = s + 2;
      ed.dispatchEvent(new Event('input'));
    }
  });

  function setMode(editing) {
    document.body.classList.toggle('editing', editing);
    bubble.textContent = editing ? '▶' : '</>';
    if (editing) ed.focus();
  }

  // Vị trí bóng
  var SIZE = 40;
  function clamp(x, y) {
    return {
      x: Math.max(0, Math.min(window.innerWidth - SIZE, x)),
      y: Math.max(0, Math.min(window.innerHeight - SIZE, y))
    };
  }
  function place(x, y) {
    var p = clamp(x, y);
    bubble.style.left = p.x + 'px';
    bubble.style.top = p.y + 'px';
    return p;
  }
  var pos = null;
  try { pos = JSON.parse(load(POS_KEY)); } catch (e) {}
  if (pos && typeof pos.x === 'number') place(pos.x, pos.y);
  else place(window.innerWidth - SIZE - 16, window.innerHeight - SIZE - 80);

  window.addEventListener('resize', function () {
    place(parseFloat(bubble.style.left) || 0, parseFloat(bubble.style.top) || 0);
  });

  // Kéo thả vs bấm
  var drag = null;
  bubble.addEventListener('pointerdown', function (e) {
    bubble.setPointerCapture(e.pointerId);
    drag = { sx: e.clientX, sy: e.clientY, ox: parseFloat(bubble.style.left), oy: parseFloat(bubble.style.top), moved: false };
  });
  bubble.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    place(drag.ox + dx, drag.oy + dy);
  });
  function end(e) {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.moved) {
      save(POS_KEY, JSON.stringify({ x: parseFloat(bubble.style.left), y: parseFloat(bubble.style.top) }));
    } else if (e.type === 'pointerup') {
      setMode(!document.body.classList.contains('editing'));
    }
  }
  bubble.addEventListener('pointerup', end);
  bubble.addEventListener('pointercancel', end);
})();
</script>
</body>
</html>
